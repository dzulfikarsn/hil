
nc: 14
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, TorchVision, [320, mobilenet_v2, DEFAULT, True, 2, True]]
  # MobileNetV2 feature maps: stride 8 (32 ch), stride 16 (96 ch), stride 32 (1280 ch).
  - [0, 1, Index, [32, 6]]
  - [0, 1, Index, [96, 13]]
  - [0, 1, Index, [320, 18]]
  - [-1, 1, SPPF, [1280, 5]]
  - [-1, 2, C2PSA, [1280]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[11, 14, 17], 1, Detect, [nc]]
